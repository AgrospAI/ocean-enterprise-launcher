# =============================================================================
# Ocean Enterprise stack — Marketplace + OE Node (no SSI)
# Following docs.oceanenterprise.io/infrastructure (Deployment Guides)
#
#   Marketplace      ->  http://localhost:8080
#   OE Node          ->  http://localhost:8000  (API port)
#   Elasticsearch 9.3.4 (node's indexer DB, internal only)
#
# Images come from the AgrospAI registry (mirrors of the Ocean Enterprise
# builds, tag "latest"):
#   registry.agrospai.udl.cat/library/oe-node:latest
#   registry.agrospai.udl.cat/library/enterprise-market:latest
# Because the tag is "latest", compose keeps whatever image is already cached:
# run `docker compose pull` to move to the newest build.
#
# All tunables live in ./.env, which ./customize.sh generates from prompts
# (see .env.example for the documented defaults).
#
# Launch with:  ./start.sh   (unlocks the node keystore, asks which block to
#                             index from, then `docker compose up -d`)
# =============================================================================

name: ocean-enterprise

services:
  # ---------------------------------------------------------------------------
  # OE Node (provider/indexer/encryptor) — docs:
  # /infrastructure/oe-node-installation-and-configuration
  # ---------------------------------------------------------------------------
  oe-node:
    # [CUSTOMIZE] pin the version/tag approved by your compatibility review
    # "latest" = newest build mirrored in the AgrospAI registry.
    image: registry.agrospai.udl.cat/library/oe-node:latest
    container_name: oe-node
    restart: unless-stopped
    ports:
      # [CUSTOMIZE] HTTP API port consumed by the marketplace/browser
      - '${NODE_HTTP_PORT:-8000}:8000'
      # Optional extras from the official compose (dashboard/admin APIs) —
      # uncomment if you need them:
      # - '9000:9000'
      # - '9001:9001'
      # - '9002:9002'
      # - '9003:9003'
      # - '9005:9005'
    depends_on:
      elasticsearch:
        condition: service_healthy
        restart: true
    environment:
      # --- REQUIRED -----------------------------------------------------------
      # Injected by ./start.sh from secrets/node.keystore.json; it is never
      # written to .env. Export it yourself if you run `docker compose` directly.
      PRIVATE_KEY: ${NODE_PRIVATE_KEY}
      # --- Blockchain RPC (OP Sepolia) ---------------------------------------
      # startBlock is set by start.sh
      # [CUSTOMIZE] chunkSize / provider URL for your expected workload
      RPCS: '{"11155420":{"rpc":"${RPC_URL}","chainId":11155420,"network":"optimism_sepolia","chunkSize":50,"startBlock":${START_BLOCK}}}'
      INDEXER_NETWORKS: '[11155420]'
      # --- Elasticsearch (indexer DB) ----------------------------------------
      DB_TYPE: elasticsearch
      DB_URL: http://elasticsearch:9200
      DB_USERNAME: elastic
      # [PLACEHOLDER] must match ELASTIC_PASSWORD in .env
      DB_PASSWORD: ${ELASTIC_PASSWORD}
      # --- IPFS (public gateway required by docs) -----------------------------
      IPFS_GATEWAY: ${IPFS_GATEWAY}
      ARWEAVE_GATEWAY: https://arweave.net/
      # --- Node fees (paid in devEURAU on OP Sepolia) -------------------------
      # [CUSTOMIZE] node operator fee policy
      FEE_TOKENS: '{"11155420":"${DEVEURAU_ADDRESS}"}'
      FEE_AMOUNT: ${NODE_FEE_AMOUNT}
      # --- HTTP ----------------------------------------------------------------
      HTTP_API_PORT: '8000'
      # --- To disable SSI keep both commented ----------------------------------
      # POLICY_SERVER_URL: http://policy-server:8001
      # POLICY_SERVER_API_KEY: ${POLICY_SERVER_API_KEY}
      # --- Ownership / admin -----------------------------------------------------
      # [CUSTOMIZE] real owner info + admin address in .env
      NODE_OWNER_INFO: ${NODE_OWNER_INFO}
      ALLOWED_ADMINS: ${ALLOWED_ADMINS}
      # --- Logs / rate limits ------------------------------------------------------
      LOG_LEVEL: info
      MAX_REQ_PER_MINUTE: '10000'
      MAX_CONNECTIONS_PER_MINUTE: '10000'
      DASHBOARD: 'true'
      # --- Compute-to-Data (C2D) ------------------------------------------------
      # Two Docker-engine environments, sized so it stays feasible on a laptop:
      #   free:  free, 1 vCPU / 1 GB RAM / 1 GB disk, <= 10 min, 1 job
      #   paid:  devEURAU per minute, 2 vCPU / 3 GB RAM / 5 GB disk, <= 30 min, 1 job
      # Admission control is per environment (`resources[].total` against that
      # environment's running jobs, `max` = per-job cap) plus a global check
      # against the SUM of all environments' totals. The connection-level
      # `resources` below does not cap that sum: it only clamps what each
      # environment may declare and supplies the default per-job `max`
      # (hardware-level knobs like `init`/`cpuList` belong there too).
      # The free environment omits its own `resources` on purpose: the loader
      # fills cpu/ram/disk from the pool, so the env-level and global checks see
      # the pool while `free.resources` stays the binding budget for free jobs.
      # `free.resources` is mandatory — without it free jobs are rejected with
      # "No such free resource cpu".
      # Job cost = price x amount x ceil(duration / 60) in token units.
      # Removing this variable (and the socket mount below) disables C2D.
      DOCKER_COMPUTE_ENVIRONMENTS: |
        [{
          "socketPath": "/var/run/docker.sock",
          "imageRetentionDays": 3,
          "resources": [
            {"id": "cpu",  "total": 2,  "max": 2, "min": 1},
            {"id": "ram",  "total": 3,  "max": 3, "min": 1},
            {"id": "disk", "total": 5,  "max": 5, "min": 1}
          ],
          "environments": [
            {
              "id": "free",
              "description": "Free C2D on this host: 1 vCPU, 1 GB RAM, 1 GB disk, max 10 min, 1 concurrent job",
              "storageExpiry": 7200,
              "minJobDuration": 60,
              "maxJobDuration": 600,
              "maxJobs": 1,
              "fees": {
                "11155420": [
                  {
                    "feeToken": "${DEVEURAU_ADDRESS}",
                    "prices": [
                      {"id": "cpu",  "price": 0},
                      {"id": "ram",  "price": 0},
                      {"id": "disk", "price": 0}
                    ]
                  }
                ]
              },
              "free": {
                "minJobDuration": 60,
                "maxJobDuration": 600,
                "maxJobs": 1,
                "resources": [
                  {"id": "cpu",  "total": 1, "max": 1, "min": 1},
                  {"id": "ram",  "total": 1, "max": 1, "min": 1},
                  {"id": "disk", "total": 1, "max": 1, "min": 1}
                ]
              },
              "enableNetwork": false
            },
            {
              "id": "paid",
              "description": "Paid C2D on this host: 2 vCPU, 3 GB RAM, 5 GB disk, max 30 min, 1 concurrent job (devEURAU per minute)",
              "storageExpiry": 7200,
              "minJobDuration": 60,
              "maxJobDuration": 1800,
              "maxJobs": 1,
              "fees": {
                "11155420": [
                  {
                    "feeToken": "${DEVEURAU_ADDRESS}",
                    "prices": [
                      {"id": "cpu",  "price": 0.001},
                      {"id": "ram",  "price": 0.001},
                      {"id": "disk", "price": 0.0001}
                    ]
                  }
                ]
              },
              "resources": [
                {"id": "cpu",  "total": 2, "max": 2, "min": 1},
                {"id": "ram",  "total": 3, "max": 2, "min": 1},
                {"id": "disk", "total": 5, "max": 5, "min": 1}
              ],
              "enableNetwork": false
            }
          ]
        }]
    volumes:
      - ./oe-node-logs:/usr/src/app/logs
      - ./oe-node-c2d-storage:/usr/src/app/c2d_storage
      - ./oe-node-databases:/usr/src/app/databases
      # C2D: lets the node start/stop job containers on the Docker host.
      # This is equivalent to root on the host — remove it (and the variable
      # above) on any deployment that should not run compute jobs.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # Elasticsearch — indexer database for the OE Node (internal network only;
  # port published for diagnostics only)
  # ---------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.4
    container_name: elasticsearch
    restart: unless-stopped
    ports:
      # [CUSTOMIZE] drop this mapping in production; the node reaches ES via
      # the internal `backend` network at http://elasticsearch:9200
      - '${ES_HTTP_PORT:-9200}:9200'
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: 'true'
      xpack.security.enabled: 'true'
      xpack.security.http.ssl.enabled: 'false'
      # [PLACEHOLDER] fabricated password pattern — generate a real one
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      # [CUSTOMIZE] raise heap for production workloads (min specs: 2 cores/16GB)
      ES_JAVA_OPTS: '-Xms1g -Xmx1g'
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ['CMD-SHELL', 'curl -s http://localhost:9200/_cluster/health | grep -vq ''"status":"red"''']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # OE Marketplace — docs:
  # /infrastructure/marketplace-installation-and-configuration
  # ---------------------------------------------------------------------------
  ocean-market:
    image: registry.agrospai.udl.cat/library/enterprise-market:latest
    container_name: ocean-market
    restart: unless-stopped
    ports:
      # [CUSTOMIZE] public port of the marketplace UI (container listens on 8008)
      - '${MARKET_HTTP_PORT:-8080}:8008'
    depends_on:
      - oe-node
    environment:
      NODE_ENV: production
      # --- OE Nodes -------------------------------------------------------------
      # Default node: encrypts at publish, decrypts at consume, serves C2D.
      # KEEP IT SLASH-FREE
      NEXT_PUBLIC_PROVIDER_URL: ${OE_NODE_URL}
      # Metadata cache(s) the catalogue is read from (v1.4.1+: JSON array —
      # must include the default node). This one takes the slash.
      NEXT_PUBLIC_METADATACACHE_URI: '["${OE_NODE_URL}/"]'
      # Nodes whose assets appear in the catalogue / can encrypt new assets.
      # Slash-free too: the market appends "/" to build the clause and the node
      # strips it again, so the stored (slash-free) endpoint matches.
      NEXT_PUBLIC_NODE_URI_INDEXED: '["${OE_NODE_URL}"]'
      # --- Blockchain RPC (OP Sepolia) --------------------------------------------
      NEXT_PUBLIC_NODE_URI_MAP: '{"11155420":"${RPC_URL}"}'
      NEXT_PUBLIC_NODE_URI: ${RPC_URL}
      # --- IPFS (Pinata) -------------------------------------------------------------
      # [PLACEHOLDER] IPFS_JWT in .env is a placeholder — get a free Pinata JWT
      # at https://app.pinata.cloud or publishing will fail.
      NEXT_PUBLIC_IPFS_GATEWAY: ${IPFS_GATEWAY}
      NEXT_PUBLIC_IPFS_UPLOAD_URL: ${IPFS_UPLOAD_URL}
      NEXT_PUBLIC_IPFS_DELETE_URL: ${IPFS_DELETE_URL}
      IPFS_JWT: ${IPFS_JWT}
      NEXT_PUBLIC_IPFS_UNPIN_FILES: 'true'
      # --- Currencies & fees (devEURAU on OP Sepolia) --------------------------------
      # Currencies accepted by the market (must be supported by OEC contracts)
      NEXT_PUBLIC_ALLOWED_ERC20_ADDRESSES: '{"11155420":["${DEVEURAU_ADDRESS}"]}'
      # [CUSTOMIZE] fixed fee per purchase (18-decimal units) / percentage fee
      NEXT_PUBLIC_CONSUME_MARKET_ORDER_FEE_MAP: ${MARKET_ORDER_FEE_MAP}
      NEXT_PUBLIC_CONSUME_MARKET_FEE: ${MARKET_PERCENT_FEE}
      NEXT_PUBLIC_MARKET_FEE_ADDRESS: ${MARKET_FEE_ADDRESS}
      # --- SSI DISABLED (address-based access control only) ---------------------------
      NEXT_PUBLIC_SSI_ENABLED: 'false'
      # --- Dataspace ---------------------------------------------------------------------
      NEXT_PUBLIC_DATASPACE: ${DATASPACE}
      # --- Others --------------------------------------------------------------------------
      # Encrypt the asset DDO at publish time (requires the OE Node above)
      NEXT_PUBLIC_ENCRYPT_ASSET: 'true'
      NEXT_PUBLIC_HIDE_ONBOARDING_MODULE_BY_DEFAULT: 'false'
      NEXT_PUBLIC_MAX_LICENSE_FILE_SIZE_KB: '700'
      # Analytics disabled (self-hosted default)
      # [CUSTOMIZE] set NEXT_PUBLIC_POSTHOG_KEY/HOST to enable PostHog analytics
      # [CUSTOMIZE] imprint/T&C/privacy URLs: leave unset to use OEC defaults
      # --- AGROPORTAL for ontology term suggestions) --------------------------
      # AGROPORTAL_API_KEY=<your-agroportal-api-key>

    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  esdata:
